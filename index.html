(()=>{'use strict';const $=id=>document.getElementById(id);let save;try{save=JSON.parse(localStorage.getItem('fnac_rebuilt_save')||'{}')}catch{save={}}save={night:1,grey:0,green:0,items:{},achievements:{},...save};const persist=()=>{try{localStorage.setItem('fnac_rebuilt_save',JSON.stringify(save))}catch{}};let sound=true,ctx=null;function beep(freq=300,duration=.1,vol=.08){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(freq,ctx.currentTime);g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration)}catch{}}function show(id){for(let x of ['menu','info','cams','victory','jumpscare'])$(x).classList.add('hidden');if(id)$(id).classList.remove('hidden')}function info(title,html){$('infoTitle').textContent=title;$('infoBody').innerHTML=html;show('info')}function btn(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;return b}function menu(){running=false;custom=false;show('menu');$('hud').classList.add('hidden');$('nextNight').textContent=save.night;$('customBtn').textContent=save.night>5?'CUSTOM NIGHT':'CUSTOM NIGHT 🔒'}
const W=19,H=19;let map=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x===0||y===0||x===W-1||y===H-1?1:0));for(let y=2;y<17;y++)for(let x of [4,14])if(y!==8&&y!==9&&y!==10)map[y][x]=1;for(let x=2;x<17;x++)for(let y of [5,13])if(x!==9&&x!==10)map[y][x]=1;let player={x:9.5,y:9.5,a:0,f:0},deans=[],running=false,paused=false,custom=false,customAI=[5,5,5,5],cameraOpen=false,flash=false,hidden=false,run=false,battery=100,t=0,last=performance.now(),lastStep=0,camIndex=0,noise=0,malfunction=0,events=0;const names=['THE DEAN','ASSISTANT DEAN','DISCIPLINE DEAN','THE PRINCIPAL'];const spots=[[2.5,2.5],[16.5,3.5],[2.5,16.5],[16.5,16.5]];const canvas=$('view'),c=canvas.getContext('2d');function resize(){canvas.width=Math.min(1100,innerWidth);canvas.height=Math.min(750,innerHeight)}addEventListener('resize',resize);resize();function walkable(x,y){return x>.3&&y>.3&&x<W-.3&&y<H-.3&&!map[Math.floor(y)]?.[Math.floor(x)]}function sight(ax,ay,bx,by){let dist=Math.hypot(bx-ax,by-ay),n=Math.ceil(dist*8);for(let i=1;i<n;i++){let q=i/n;if(!walkable(ax+(bx-ax)*q,ay+(by-ay)*q))return false}return true}function start(){beep(430);running=true;paused=false;cameraOpen=false;flash=false;hidden=false;run=false;battery=100;t=0;noise=0;malfunction=0;events=0;player={x:9.5,y:9.5,a:-Math.PI/2,f:0};deans=spots.map(([x,y],i)=>({x,y,f:i>=2?1:0,i,step:0,active:custom?customAI[i]>0:(i===0||save.night>=i+1),alert:0}));show(null);$('hud').classList.remove('hidden');updateHud();last=performance.now();}function updateHud(){$('night').textContent=custom?'CUSTOM NIGHT':'NIGHT '+save.night;$('floor').textContent='FLOOR '+(player.f+1);$('clock').textContent=(Math.floor(t/38)||12)+' AM';$('battery').textContent='🔦 '+Math.ceil(battery)+'%';$('slips').textContent='◻ '+save.grey+' ▣ '+save.green}function win(){running=false;let g=60+save.night*20,h=save.night>=3?1:0;save.grey+=g;save.green+=h;save.achievements['Night '+save.night]=true;if(!custom)save.night=Math.min(6,save.night+1);else save.achievements[ function renderScene(target,px,py,angle,f,scale=1){let ww=target.width,hh=target.height,cc=target.getContext('2d');let sky=cc.createLinearGradient(0,0,0,hh);sky.addColorStop(0,'#0a161a');sky.addColorStop(.5,'#101e1e');sky.addColorStop(.501,'#101713');sky.addColorStop(1,'#070c0c');cc.fillStyle=sky;cc.fillRect(0,0,ww,hh);const strips=Math.max(100,Math.floor(ww/3)),sw=ww/strips;for(let i=0;i<strips;i++){let ra=angle+Math.atan((i/strips-.5)*1.3),dx=Math.cos(ra),dy=Math.sin(ra),dist=0;while(dist<24){dist+=.045;if(!walkable(px+dx*dist,py+dy*dist))break}dist=Math.max(.2,dist*Math.cos(ra-angle));let wallH=Math.min(hh*2,hh/(dist*.72)),x=i*sw,shade=Math.max(.06,1/(1+dist*.21));let glow=flash&&target===canvas?Math.max(0,1-Math.abs(i/strips-.5)*2)*.32:0;let v=Math.floor((shade+glow)*105);cc.fillStyle=`rgb(${Math.floor(v*.65)},${v},${Math.floor(v*.86)})`;cc.fillRect(x,hh/2-wallH/2,sw+1,wallH);if(i%10===0){cc.fillStyle='#0a141180';cc.fillRect(x,hh/2-wallH/2,1,wallH)}cc.fillStyle=`rgba(0,0,0,${Math.min(.85,dist*.05)})`;cc.fillRect(x,hh/2-wallH/2,sw+1,wallH)}let actors=deans.filter(d=>d.active&&d.f===f).map(d=>({d,dist:Math.hypot(d.x-px,d.y-py),a:Math.atan2(d.y-py,d.x-px)-angle})).sort((a,b)=>b.dist-a.dist);for(let a of actors){let da=Math.atan2(Math.sin(a.a),Math.cos(a.a));if(Math.abs(da)>.8||!sight(px,py,a.d.x,a.d.y))continue;let size=Math.min(hh*1.3,hh/(a.dist*.7)),x=ww/2+Math.tan(da)*ww/1.3,y=hh/2;cc.fillStyle='#060908';cc.fillRect(x-size*.18,y-size*.24,size*.36,size*.73);cc.fillStyle='#a3b9a8';cc.beginPath();cc.ellipse(x,y-size*.39,size*.17,size*.21,0,0,7);cc.fill();cc.fillStyle='#f6e9b2';cc.fillRect(x-size*.1,y-size*.42,size*.06,size*.025);cc.fillRect(x+size*.04,y-size*.42,size*.06,size*.025);cc.fillStyle='#274c39';cc.fillRect(x-size*.04,y-size*.16,size*.08,size*.2)}cc.fillStyle='rgba(0,0,0,.18)';cc.fillRect(0,0,ww,hh);let vignette=cc.createRadialGradient(ww/2,hh/2,hh*.1,ww/2,hh/2,ww*.8);vignette.addColorStop(0,'#0000');vignette.addColorStop(1,'#000d');cc.fillStyle=vignette;cc.fillRect(0,0,ww,hh)}function cameraScreen(){const a=$('camView');a.width=Math.min(800,innerWidth-50);a.height=Math.min(430,innerHeight*.6);let pos=[[9.5,9.5,0,0],[3,3,0,0],[16,3,Math.PI,0],[3,16,0,0],[16,16,Math.PI,0],[9.5,9.5,0,1],[3,3,0,1],[16,16,Math.PI,1]][camIndex];renderScene(a,...pos);const cc=a.getContext('2d');for(let i=0;i<35;i++){cc.fillStyle='rgba(180,220,190,.03)';cc.fillRect(0,Math.random()*a.height,a.width,1)}if(malfunction>0){cc.fillStyle='#07120e';cc.fillRect(0,0,a.width,a.height);cc.fillStyle='#b7e9c6';cc.font='bold 30px monospace';cc.fillText('SIGNAL LOST',a.width*.28,a.height*.5)}}function cameras(){if(!running)return;cameraOpen=!cameraOpen;show(cameraOpen?'cams':null);$('hud').classList.toggle('hidden',cameraOpen);beep(380,.06);if(cameraOpen)cameraScreen()}

function update(dt){if(!running||paused)return;t+=dt;if(t>=228){win();return}if(flash){battery=Math.max(0,battery-dt*(save.items.battery?.38:.65));if(!battery)flash=false}let fw=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y,side=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;let sprint=run||keys.ShiftLeft||keys.ShiftRight,m=Math.hypot(fw,side);if(!hidden&&!cameraOpen&&m>.02){let sp=dt*(sprint?3.5:2.15)*(save.items.shoes?1.13:1),dx=(Math.cos(player.a)*fw-Math.sin(player.a)*side)/Math.max(1,m)*sp,dy=(Math.sin(player.a)*fw+Math.cos(player.a)*side)/Math.max(1,m)*sp;if(walkable(player.x+dx,player.y))player.x+=dx;if(walkable(player.x,player.y+dy))player.y+=dy;noise=sprint?5:2;if(t-lastStep>.36){beep(sprint?100:75,.025,.013);lastStep=t}}else noise=Math.max(0,noise-dt*2);if(Math.hypot(player.x-9.5,player.y-9.5)<1.3&&keys.KeyE&&t>3){player.f=1-player.f;keys.KeyE=false;notice('STAIRWELL — FLOOR '+(player.f+1))}for(let d of deans){if(!d.active)continue;let dist=Math.hypot(player.x-d.x,player.y-d.y),detect=d.f===player.f&&dist<(flash&&d.i===2?9:noise>3&&d.i===1?8:5)&&sight(d.x,d.y,player.x,player.y);if(detect&&!hidden)d.alert=5;else d.alert=Math.max(0,d.alert-dt);d.step+=dt;if(d.step>.5){d.step=0;let goal=d.alert>0&&d.f===player.f?{x:player.x,y:player.y}:{x:spots[d.i][0]+Math.sin(t*.12+d.i*2)*5,y:spots[d.i][1]+Math.cos(t*.1+d.i)*5};let a=Math.atan2(goal.y-d.y,goal.x-d.x),speed=(.5+save.night*.13+(d.i===1?.35:0))*(custom?customAI[d.i]/7:1);let dx=Math.cos(a)*speed*.5,dy=Math.sin(a)*speed*.5;if(walkable(d.x+dx,d.y))d.x+=dx;if(walkable(d.x,d.y+dy))d.y+=dy;if(d.alert>0&&dist<1.05&&!hidden)caught(d)}}if(t-events>14){events=t;if(Math.random()<.35){malfunction=2;beep(115,.35);notice('CAMERA SIGNAL INTERFERENCE')}else{beep(160,.17);notice(['A DOOR SLAMS IN THE DISTANCE','FOOTSTEPS ECHO UPSTAIRS','THE LIGHTS FLICKER'][Math.floor(Math.random()*3)])}}malfunction=Math.max(0,malfunction-dt);updateHud()}

$('playBtn').onclick=()=>{custom=false;start()};$('retryBtn').onclick=start;$('nextBtn').onclick=start;$('menuBtn').onclick=menu;$('scareMenu').onclick=menu;$('infoClose').onclick=menu;$('camBtn').onclick=cameras;$('closeCam').onclick=cameras;$('flashBtn').onclick=toggleFlash;$('hideBtn').onclick=toggleHide;$('pauseBtn').onclick=pause;$('runBtn').onpointerdown=()=>run=true;for(let ev of ['pointerup','pointercancel','pointerleave'])$('runBtn').addEventListener(ev,()=>run=false);$('helpBtn').onclick=()=>info('HOW TO PLAY','<p>Survive 12 AM–6 AM. WASD to move, mouse to look, Shift to sprint, C for cameras, F for flashlight, E to hide. Mobile: left joystick and drag right side to look.</p><p>Find the central stairwell (near the starting position) and press E to change floors. Deans patrol both floors. Flashlight power is limited. Survive to earn slips.</p>');$('logBtn').onclick=()=>info('UPDATE LOG','<p><b>v2.0 — Rebuilt:</b> Single-file game, working menu, first-person corridor rendering, 2 floors, enemy chases, cameras, flashlight, shop, achievements, custom night, jumpscare, and 6 AM confetti.</p><p><b>Earlier prototypes:</b> Paranoia update, Nightfall update, Shadows & Detail.</p>');$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent='SOUND: '+(sound?'ON':'OFF')};$('shopBtn').onclick=()=>{info('SLIP SHOP',`<p>◻ ${save.grey} GREY · ▣ ${save.green} GREEN</p><div id="buy"></div>`);const b=$('buy');for(let [id,label,cost,type] of [['battery','Extended flashlight battery',100,'grey'],['shoes','Quiet movement',140,'grey'],['radar','Security scanner',3,'green']]){let q=btn((save.items[id]?'OWNED — ':'')+label+' · '+cost+' '+type,()=>{if(save.items[id])return;if(save[type]<cost){alert('Not enough slips. Survive more nights!');return}save[type]-=cost;save.items[id]=true;persist();$('shopBtn').click()});q.disabled=!!save.items[id];b.appendChild(q)}};$('trophyBtn').onclick=()=>info('ACHIEVEMENTS','<p>'+Array.from({length:5},(_,i)=>'<div class="trophy">'+(save.ach
